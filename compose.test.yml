name: hammond-modern-next
services:
  hammond-modern:
    build: .
    image: hammond-modern:next
    container_name: hammond-modern-next
    ports:
      - "${HAMMOND_DEVELOP_PORT:-3016}:3000"
    environment:
      TZ: Europe/Berlin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TANKERKOENIG_API_KEY: ${TANKERKOENIG_API_KEY:-}
    volumes:
      - "${HAMMOND_DEVELOP_CONFIG_DIR:-./develop-data/config}:/config"
      - "${HAMMOND_DEVELOP_ASSETS_DIR:-./develop-data/assets}:/assets"
    restart: unless-stopped
