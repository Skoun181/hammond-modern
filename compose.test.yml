services:
  hammond-modern:
    build: .
    image: hammond-modern:next
    container_name: hammond-modern-next
    ports:
      - "3006:3000"
    environment:
      TZ: Europe/Berlin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt}
      TANKERKOENIG_API_KEY: ${TANKERKOENIG_API_KEY:-}
    volumes:
      - ./data/config:/config
      - ./data/assets:/assets
    restart: unless-stopped
