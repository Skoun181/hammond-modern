# Synology Container Manager: create the directories under /volume1/docker first.
# Build this image on an amd64 host with Docker BuildKit, or load a built image onto the NAS.
services:
  hammond-modern:
    build:
      context: .
      dockerfile: Dockerfile
    image: hammond-modern:local
    platform: linux/amd64
    container_name: hammond-modern
    ports:
      - "3005:3000"
    environment:
      TZ: Europe/Berlin
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET in .env}
      PUID: "1026"
      PGID: "100"
    volumes:
      - /volume1/docker/hammond-modern/config:/config
      - /volume1/docker/hammond-modern/assets:/assets
    restart: unless-stopped
