name: Publish Develop to GHCR

on:
  push:
    branches:
      - develop/hammond-modern-next
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hammond-ghcr-develop
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/develop/hammond-modern-next'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/skoun181/hammond-modern
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - name: Backend tests
        working-directory: server
        run: go test ./...
      - uses: docker/setup-buildx-action@v3
      - name: Build Develop image (including frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/skoun181/hammond-modern:develop
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hammond-develop
          cache-to: type=gha,mode=max,scope=hammond-develop
      - name: Smoke test isolated container
        run: |
          set -euo pipefail
          docker run -d --name hammond-develop-smoke -p 127.0.0.1:3306:3000 -e JWT_SECRET="$(openssl rand -hex 32)" "$IMAGE:develop"
          trap 'docker rm -fv hammond-develop-smoke >/dev/null 2>&1 || true' EXIT
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3306/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs hammond-develop-smoke
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop/hammond-modern-next" --jq .object.sha)"
          if [ "$head" != "$REVISION" ]; then
            echo "A newer Develop commit exists; skipping outdated publication."
            exit 0
          fi
          docker tag "$IMAGE:develop" "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:develop"
          docker manifest inspect "$IMAGE:develop" >/dev/null
