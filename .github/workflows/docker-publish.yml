name: Publish Hammond Modern to Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version (e.g. 1.1.5)"
        required: true
        default: "1.1.5"
        type: string
      latest:
        description: "Also update latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          ref: stable/hammond-modern

      - name: Verify version input
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must look like 1.1.5"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: skoun181
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push version
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            skoun181/hammond-modern:${{ inputs.version }}
            ${{ inputs.latest && 'skoun181/hammond-modern:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
