volumes:
  dependencies:

services:
  dev:
    build:
      context: .
      dockerfile: ./docker-dev.dockerfile
    ports:
      - 8080:8080
    volumes:
      - .:/app
      - dependencies:/app/node_modules
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
